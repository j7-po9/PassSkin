name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # اختياري: لو حطيت الشهادات في GitHub Secrets بدل ما ترفعها مع الكود
      - name: Add certificates from secrets
        env:
          PASS_P12_BASE64: ${{ secrets.PASS_P12_BASE64 }}
          WWDR_CER_BASE64: ${{ secrets.WWDR_CER_BASE64 }}
        run: |
          if [ -n "$PASS_P12_BASE64" ]; then echo "$PASS_P12_BASE64" | base64 --decode > PassSkin/Resources/pass.p12; fi
          if [ -n "$WWDR_CER_BASE64" ]; then echo "$WWDR_CER_BASE64" | base64 --decode > PassSkin/Resources/AppleWWDRCAG4.cer; fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild \
            -project PassSkin.xcodeproj \
            -scheme PassSkin \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/PassSkin.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/PassSkin.xcarchive/Products/Applications/PassSkin.app build/Payload/
          cd build && zip -qry PassSkin-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PassSkin-unsigned-ipa
          path: build/PassSkin-unsigned.ipa
