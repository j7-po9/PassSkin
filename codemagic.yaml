workflows:
  build-ipa:
    name: Build unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Archive (unsigned)
        script: |
          xcodebuild \
            -project PassSkin.xcodeproj \
            -scheme PassSkin \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/PassSkin.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package IPA
        script: |
          mkdir -p build/Payload
          cp -R build/PassSkin.xcarchive/Products/Applications/PassSkin.app build/Payload/
          cd build && zip -qry PassSkin-unsigned.ipa Payload
    artifacts:
      - build/PassSkin-unsigned.ipa
